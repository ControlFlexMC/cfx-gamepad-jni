# jitpack.yml — JitPack build configuration for cfx-gamepad-jni
#
# Native libraries are build output and are no longer committed: the
# build-natives workflow compiles them on GitHub-hosted runners and attaches the
# resulting JAR (plus checksums.txt) to the GitHub release for each v* tag.
#
# JitPack cannot reproduce that build (it runs on a single Linux x86_64 machine),
# so it does not build anything here. Instead the install hook downloads the
# released JAR, verifies its SHA-256 against the published checksums, and
# installs it into the local Maven repository JitPack serves from. The artifact
# JitPack hands out is therefore byte-identical to the one CI produced.

jdk:
  # JitPack's "latest" image no longer ships jdk-11: the openjdk11 pin made
  # gradlew die with "JAVA_HOME is set to an invalid directory: /usr/lib/jvm/jdk-11"
  # (v0.9.0.4 build log). 17 is what the image provides and what the project is
  # developed against; javac still emits --release 8 bytecode.
  - openjdk17

# Replaces JitPack's default `./gradlew build publishToMavenLocal`.
# VERSION is supplied by JitPack and holds the tag being built (e.g. v0.9.5).
install:
  - chmod +x tools/jitpack-install.sh
  - ./tools/jitpack-install.sh

# To publish a version: push a v* tag. The workflow builds and attaches the JAR,
# after which the first JitPack request for that tag installs it.
# If a request arrives before the release assets exist, the build fails; re-run
# it from https://jitpack.io/#ControlFlexMC/cfx-gamepad-jni once CI finishes.
