name: build natives

# Builds every packaged native library from source on GitHub-hosted runners, then
# packages the release JAR from those freshly built files. Tag pushes attach the
# JAR and a checksums file to the GitHub release.
#
# Native libraries are not committed. JitPack serves the Maven artifact by
# downloading that released JAR and installing it verbatim (jitpack.yml →
# tools/jitpack-install.sh), so the bytes behind the Maven coordinate are the ones
# this workflow built.
#
# Coverage is a matrix of native runners, not one cross-compiling host:
#
#   linux-x86_64    ubuntu-24.04      gcc 9 in an ubuntu:20.04 container
#   linux-aarch64   ubuntu-24.04-arm  gcc 9 in an arm64v8/ubuntu:20.04 container
#   darwin-*        macos-14          clang; --all emits arm64 + x86_64
#   windows-*       windows-latest    MSYS2 MinGW x86_64; aarch64 cross-compiled by zig
#   android-*       ubuntu-24.04      NDK; libgamepadjni.so only, SDL3 comes from the launcher APK
#
# The Linux jobs build inside a 20.04 container on purpose. A shared library
# records the glibc symbol versions it needs, and building on the runner's own
# 24.04 toolchain pushed libSDL3.so from GLIBC_2.29 to GLIBC_2.38 — unloadable on
# Ubuntu 22.04, Debian 12 and SteamOS. 20.04 keeps the floor where it was; the
# step at the end of the job fails the build if it ever creeps up again.
#
# SDL3 on Windows stays the official upstream 3.4.14 DLL copied by
# build-sdl3-windows.bat (byte-for-byte what LWJGL 3.4.3 ships). Every other
# platform compiles SDL3 from the pinned third_party/SDL submodule.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    # Container jobs do not inherit the runner's toolcache JDK, and the JNI build
    # needs jni.h from one. The package name differs per architecture.
    env:
      JAVA_HOME: ${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: ubuntu:20.04
            arch: x86_64
            jdk: /usr/lib/jvm/java-11-openjdk-amd64
          - runner: ubuntu-24.04-arm
            image: arm64v8/ubuntu:20.04
            arch: aarch64
            jdk: /usr/lib/jvm/java-11-openjdk-arm64
    steps:
      # The image has no git, and checkout runs inside the container, so this has
      # to come first. ForceIPv4: Docker's default network hangs on the IPv6
      # route to the Ubuntu archives, which stalls apt-get update indefinitely.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=30 install -y --no-install-recommends \
                  git ca-certificates build-essential cmake libudev-dev \
                  libusb-1.0-0-dev openjdk-11-jdk-headless

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build trimmed SDL3
        run: ./prebuilt/build-sdl3.sh --arch ${{ matrix.arch }}

      - name: Build JNI library
        run: ./prebuilt/build-jni.sh --arch ${{ matrix.arch }}

      # Keep the Linux floor at Ubuntu 20.04 (glibc 2.31). Files built against a
      # newer libc refuse to load on older distros with "version 'GLIBC_x.y'
      # not found", which is a hard crash for anyone on 22.04 or Debian 12.
      - name: Check the glibc floor
        run: |
          lib="prebuilt/sdl/trimmed/linux-${{ matrix.arch }}/libSDL3.so"
          highest=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "$lib requires $highest"
          # sort -V puts the larger of the two last: if that is the library's
          # requirement rather than the floor, the library is too new.
          if [ "$(printf '%s\n%s\n' "$highest" 'GLIBC_2.31' | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::$lib needs $highest, which is newer than the GLIBC_2.31 floor"
            exit 1
          fi
          echo "ok — at or below the 2.31 floor"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux-${{ matrix.arch }}
          if-no-files-found: error
          # Anchor every artifact at prebuilt/ so all jobs produce the same
          # internal layout (jni/..., sdl/trimmed/...). Uploading individual
          # subdirectories makes the artifact root depend on whichever paths
          # match, which silently dropped the Android libraries once.
          path: |
            prebuilt/**
            !prebuilt/jni/build/**
            !prebuilt/link-only/**
            !prebuilt/sdl/build/**
            !prebuilt/sdl/include/**
            !prebuilt/sdl/lwjgl-sdl-3.4.3/**

  macos:
    name: darwin (arm64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build trimmed SDL3 (both archs)
        run: ./prebuilt/build-sdl3.sh --all

      - name: Build JNI library (both archs)
        run: ./prebuilt/build-jni.sh --all

      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos
          if-no-files-found: error
          path: |
            prebuilt/**
            !prebuilt/jni/build/**
            !prebuilt/link-only/**
            !prebuilt/sdl/build/**
            !prebuilt/sdl/include/**
            !prebuilt/sdl/lwjgl-sdl-3.4.3/**

  windows:
    name: windows (x86_64 + aarch64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Default mode of the script: copies the official SDL 3.4.14 DLLs out of
      # prebuilt/sdl/lwjgl-sdl-3.4.3. Pass --build here instead if a real MinGW
      # trim of SDL3 is ever wanted for Windows.
      - name: Stage SDL3 (official upstream binaries)
        shell: cmd
        run: prebuilt\build-sdl3-windows.bat --copy

      - name: Install zig for the aarch64 cross build
        shell: pwsh
        run: |
          choco install zig -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            make

      - name: Build JNI library (x86_64 + aarch64)
        shell: msys2 {0}
        run: |
          # `--all` silently skips windows-aarch64 when no cross compiler is on
          # PATH, which shipped a JAR without that DLL once. Make zig visible and
          # fail loudly if it is missing.
          export PATH="/c/ProgramData/chocolatey/bin:${PATH}"
          command -v zig >/dev/null || { echo "::error::zig is not on PATH"; exit 1; }
          zig version
          cd prebuilt && ./build-jni.sh --all

      - name: Verify both Windows architectures were built
        shell: bash
        run: |
          for f in prebuilt/jni/windows-x86_64/gamepadjni.dll prebuilt/jni/windows-aarch64/gamepadjni.dll; do
            [ -s "$f" ] || { echo "::error::missing $f"; exit 1; }
            ls -l "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: natives-windows
          if-no-files-found: error
          path: |
            prebuilt/jni/windows-x86_64
            prebuilt/jni/windows-aarch64
            prebuilt/sdl/trimmed/windows-x86_64
            prebuilt/sdl/trimmed/windows-aarch64

  android:
    name: android (3 ABIs)
    runs-on: ubuntu-24.04
    env:
      # Pin the NDK explicitly. The runner image presets ANDROID_NDK_ROOT, and
      # build-jni-android.sh trusts it, so without this the version compiled into
      # the JAR is whichever NDK the image happened to ship that week — silently.
      # A missing pin is a loud failure, which is what we want.
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build JNI libraries
        run: |
          [ -d "$ANDROID_NDK_ROOT" ] || {
            echo "::error::pinned NDK is gone: $ANDROID_NDK_ROOT"
            echo "Available:"; ls /usr/local/lib/android/sdk/ndk || true
            exit 1
          }
          echo "NDK: $ANDROID_NDK_ROOT"
          ./prebuilt/build-jni-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: natives-android
          if-no-files-found: error
          path: |
            prebuilt/**
            !prebuilt/jni/build/**
            !prebuilt/link-only/**
            !prebuilt/sdl/**

  package:
    name: package jar
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: staging

      # The natives are not in the repository, so the JAR is assembled purely from
      # what the matrix jobs just produced.
      - name: Install built natives
        run: |
          mkdir -p prebuilt/jni prebuilt/sdl/trimmed
          cp -a staging/jni/. prebuilt/jni/
          cp -a staging/sdl/trimmed/. prebuilt/sdl/trimmed/
          find prebuilt/jni prebuilt/sdl/trimmed -type f \
            \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) | sort

      # A missing platform used to sail through: upload-artifact only fails when a
      # job produces no files at all, so one absent library produced a JAR that
      # silently lacked a platform. Refuse to package an incomplete set.
      - name: Verify every platform is present
        run: |
          fail=0
          for p in darwin-aarch64 darwin-x86_64 linux-aarch64 linux-x86_64 \
                   windows-x86_64 windows-aarch64 \
                   android-arm64-v8a android-armeabi-v7a android-x86_64; do
            if ! ls prebuilt/jni/"$p"/* >/dev/null 2>&1; then
              echo "::error::no JNI library for $p"
              fail=1
            fi
          done
          for p in darwin-aarch64 darwin-x86_64 linux-aarch64 linux-x86_64 \
                   windows-x86_64 windows-aarch64; do
            if ! ls prebuilt/sdl/trimmed/"$p"/* >/dev/null 2>&1; then
              echo "::error::no SDL3 library for $p"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          find prebuilt/jni prebuilt/sdl/trimmed -type f | sort

      # jar depends on verifyNativeSymbols, which fails if any packaged native is
      # missing an entry point declared in GamepadJNI.java.
      - name: Build jar
        run: ./gradlew --no-daemon clean jar

      - name: Checksums
        run: |
          {
            find prebuilt/jni prebuilt/sdl/trimmed -type f \
              \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) \
              -exec sha256sum {} + | sort
            sha256sum build/libs/*.jar
          } > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-jar
          if-no-files-found: error
          path: |
            build/libs/*.jar
            checksums.txt

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --notes "Built by GitHub Actions from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})."
          gh release upload "${GITHUB_REF_NAME}" \
            build/libs/*.jar checksums.txt --clobber
