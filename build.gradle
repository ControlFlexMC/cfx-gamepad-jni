plugins {
    id 'java-library'
    id 'maven-publish'
}

// group and version are read from gradle.properties automatically.
// Override version at build time: gradle clean jar -Pversion=x.y.z

java {
    sourceCompatibility = JavaVersion.toVersion(
        findProperty('javaSourceCompatibility') ?: '1.8'
    )
    targetCompatibility = JavaVersion.toVersion(
        findProperty('javaTargetCompatibility') ?: '1.8'
    )
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.apache.logging.log4j:log4j-api:2.20.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'gamepad-jni',
            'Implementation-Version': archiveVersion,
            'Automatic-Module-Name': 'com.ifels.gamepadjni'
        )
    }

    // Bundled desktop SDL3 from prebuilt/sdl/trimmed (same binaries CMake links).
    // Headers stay in prebuilt/sdl/include.
    from('prebuilt/sdl/trimmed') {
        include 'windows-x86_64/*.dll'
        include 'windows-aarch64/*.dll'
        include 'darwin-aarch64/*.dylib'
        include 'darwin-x86_64/*.dylib'
        include 'linux-x86_64/*.so*'
        include 'linux-aarch64/*.so*'
        into 'native'
    }
    from('prebuilt/jni') {
        include 'windows-x86_64/*.dll'
        include 'windows-aarch64/*.dll'
        include 'darwin-aarch64/*.dylib'
        include 'darwin-x86_64/*.dylib'
        include 'linux-x86_64/*.so*'
        include 'linux-aarch64/*.so*'
        // Android: only our JNI bridge. libSDL3.so is provided by the launcher
        // APK at runtime, never packaged - see spec section 6.1/6.4.
        include 'android-arm64-v8a/*.so*'
        include 'android-armeabi-v7a/*.so*'
        include 'android-x86_64/*.so*'
        into 'native'
    }
}

// ─────────────────────────────────────────────
// Maven Publishing (for JitPack / local Maven repo)
// ─────────────────────────────────────────────
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'cfx-gamepad-jni'
                description = 'A lightweight Java JNI wrapper exposing the SDL3 Gamepad API for the Control Flex Minecraft mod'
                url = 'https://github.com/ControlFlexMC/cfx-gamepad-jni'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/ControlFlexMC/cfx-gamepad-jni/blob/main/LICENSE'
                    }
                }

                developers {
                    developer {
                        id = 'ifels'
                        name = 'ifels'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/ControlFlexMC/cfx-gamepad-jni.git'
                    developerConnection = 'scm:git:ssh://github.com/ControlFlexMC/cfx-gamepad-jni.git'
                    url = 'https://github.com/ControlFlexMC/cfx-gamepad-jni'
                }
            }
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    // --release pins the javac API table to the target version, so a JDK 9+
    // method call fails the build instead of throwing NoSuchMethodError on a
    // real JDK 8 runtime. javac 8 has no --release flag, and a JDK 8 compiler
    // cannot leak newer platform APIs anyway, so only JDK 9+ gets the flag.
    if (JavaVersion.current().isJava9Compatible()) {
        def target = (findProperty('javaTargetCompatibility') ?: '1.8') as String
        options.release = target.contains('.')
                ? target.tokenize('.').last().toInteger()
                : target.toInteger()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// ─────────────────────────────────────────────
// Native library / Java API consistency check
// ─────────────────────────────────────────────
// Every native method declared in GamepadJNI.java must have an exported entry
// point in each packaged JNI binary. A stale binary (built before a new native
// method was added) makes that method throw UnsatisfiedLinkError at runtime —
// exactly what shipped in 0.10.2, where the Windows DLL predated
// SDL_WasInit/SDL_QuitSubSystem (see ControlFlex
// issue/gamepad-jni-stale-natives/root-cause-analysis.md).

def jniSymbolFor = { String method -> 'Java_com_ifels_gamepadjni_GamepadJNI_' + method.replace('_', '_1') }

def collectNativeMethods = { File sourceFile, String regex ->
    def names = []
    if (sourceFile.exists()) {
        sourceFile.eachLine('ISO-8859-1') { line ->
            def m = line =~ regex
            if (m.find()) {
                names << m.group(1).replace('_1', '_')
            }
        }
    }
    names
}

// Methods declared in Java: `public static native <type> name(`
def declaredNativeMethods = {
    collectNativeMethods(file('src/main/java/com/ifels/gamepadjni/GamepadJNI.java'),
            /public\s+static\s+native\s+[\w\[\]<>.]+\s+(\w+)\s*\(/)
}

// Methods implemented only for macOS (src/main/c/gamepad_jni_macos.m, APPLE only)
def darwinOnlyMethods = {
    collectNativeMethods(file('src/main/c/gamepad_jni_macos.m'),
            /Java_com_ifels_gamepadjni_GamepadJNI_(\w+)\s*\(/)
}

// Every packaged platform is now built from the current C source, so drift fails
// the build outright. The linux-x86_64 / linux-aarch64 exemptions that tracked
// the stale 0.10.x natives (ControlFlex
// issue/gamepad-jni-stale-natives/root-cause-analysis.md) were removed once those
// binaries were rebuilt.
//
// SDL_GetVersion is in C and in the Android + Darwin natives. Linux/Windows
// binaries have not been rebuilt yet; Java callers already catch
// UnsatisfiedLinkError. Drop this list when those natives are rebuilt.
def getVersionPendingPlatforms = [
        'linux-x86_64', 'linux-aarch64',
        'windows-x86_64', 'windows-aarch64',
] as Set

tasks.register('verifyNativeSymbols') {
    group = 'verification'
    description = 'Fails when a packaged native library lacks an entry point declared in GamepadJNI.java'

    inputs.dir('prebuilt/jni')
    inputs.file('src/main/java/com/ifels/gamepadjni/GamepadJNI.java')
    inputs.file('src/main/c/gamepad_jni_macos.m')

    doLast {
        def allMethods = declaredNativeMethods()
        def darwinOnly = darwinOnlyMethods()
        def failures = []
        int platforms = 0

        // Only the per-platform install directories ship; prebuilt/jni/build is the
        // CMake build tree (gitignored intermediates) and must not be scanned.
        def platformDirs = file('prebuilt/jni').listFiles()
                ?.findAll { it.isDirectory() && it.name != 'build' }
        if (platformDirs == null || platformDirs.isEmpty()) {
            throw new GradleException('prebuilt/jni is empty — no JNI binaries to verify')
        }

        platformDirs.sort { it.name }.each { dir ->
            def binary = dir.listFiles()?.find {
                it.isFile() && (it.name.endsWith('.dll') || it.name.endsWith('.so') || it.name.endsWith('.dylib'))
            }
            if (binary == null) {
                logger.warn("[verifyNativeSymbols] ${dir.name}: no JNI binary — nothing to verify")
                return
            }
            platforms++

            boolean isDarwin = dir.name.startsWith('darwin')
            def required = allMethods.findAll { m ->
                (isDarwin || !darwinOnly.contains(m)) &&
                        !(m == 'SDL_GetVersion' && getVersionPendingPlatforms.contains(dir.name))
            }
            // Symbol names live in the export table as plain ASCII, so a byte scan
            // over the binary is enough to detect a binary that was never rebuilt.
            def text = new String(binary.bytes, 'ISO-8859-1')
            def missing = required.findAll { m -> !text.contains(jniSymbolFor(m)) }

            if (missing) {
                failures << "${dir.name}/${binary.name} lacks ${missing.collect { jniSymbolFor(it) }}"
            } else {
                logger.lifecycle("[verifyNativeSymbols] ${dir.name}/${binary.name}: OK " +
                        "(${required.size()} declared entry points present)")
            }
        }

        if (failures) {
            throw new GradleException('Native library(s) do not match the Java API:\n  ' +
                    failures.join('\n  ') +
                    '\nRebuild the affected libraries (prebuilt/build-jni.sh) and re-commit them.')
        }
        logger.lifecycle("[verifyNativeSymbols] checked ${platforms} platform(s)")
    }
}

tasks.named('check') { dependsOn 'verifyNativeSymbols' }
tasks.named('jar') { dependsOn 'verifyNativeSymbols' }

// ─────────────────────────────────────────────
// Jar content assertions
//
// The contract this guards (spec sections 4 and 6.4):
//   - all three Android libgamepadjni.so are packaged
//   - no Android libSDL3.so is ever packaged; the launcher APK provides it
//   - the desktop native directories are still there
// ─────────────────────────────────────────────
tasks.register('verifyJarContents') {
    dependsOn tasks.named('jar')
    def jarProvider = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(jarProvider)
    doLast {
        def entries = []
        new java.util.zip.ZipFile(jarProvider.get().asFile).withCloseable { zip ->
            entries = zip.entries().collect { it.name }
        }
        def required = [
                'native/android-arm64-v8a/libgamepadjni.so',
                'native/android-armeabi-v7a/libgamepadjni.so',
                'native/android-x86_64/libgamepadjni.so',
                'native/darwin-aarch64/libgamepadjni.dylib',
                'native/darwin-aarch64/libSDL3.0.dylib',
                'native/darwin-x86_64/libgamepadjni.dylib',
                'native/darwin-x86_64/libSDL3.0.dylib',
                'native/linux-x86_64/libgamepadjni.so',
                'native/linux-x86_64/libSDL3.so',
                'native/linux-aarch64/libgamepadjni.so',
                'native/linux-aarch64/libSDL3.so',
                'native/windows-x86_64/gamepadjni.dll',
                'native/windows-x86_64/SDL3.dll',
                'native/windows-aarch64/gamepadjni.dll',
                'native/windows-aarch64/SDL3.dll',
        ]
        def missing = required.findAll { !entries.contains(it) }
        if (missing) {
            throw new GradleException("verifyJarContents: missing entries ${missing}")
        }
        def forbidden = entries.findAll {
            it.startsWith('native/android-') && it.contains('libSDL3')
        }
        if (forbidden) {
            throw new GradleException(
                    "verifyJarContents: the Android libSDL3.so must never be packaged: ${forbidden}")
        }
        logger.lifecycle("verifyJarContents: OK ({} entries, {} natives checked)",
                entries.size(), required.size())
    }
}

tasks.named('check') { dependsOn tasks.named('verifyJarContents') }
